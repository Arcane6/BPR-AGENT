name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cadeia de suprimentos (item N6, docs/SEGURANCA.md): as Actions vão presas
# pelo SHA do commit, e não pela tag, porque tag se move; quem as atualiza
# é o Dependabot (.github/dependabot.yml). Os pacotes Python se instalam
# com hash conferido (--require-hashes), e o front pelo package-lock.json,
# que já traz o hash (integrity) de cada pacote. O token só lê.
permissions:
  contents: read

jobs:
  python:
    name: Python (lint e testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      # Os dois locks precisam bater com os .in: Dependabot ou mão que mude
      # um sem o outro quebra aqui, e não na instalação da máquina.
      - name: locks em dia com os .in
        run: |
          python -m pip install uv==0.8.17
          python -m uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt --quiet
          python -m uv pip compile requirements-dev.in -c requirements.txt --universal --python-version 3.11 --generate-hashes -o requirements-dev.txt --quiet
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - run: ruff check .
      # Sem OneDrive, BigQuery nem Gemini (tests/conftest.py).
      - run: python -m pytest

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # npm ci instala exatamente o package-lock.json, e falha se ele não
      # bate com o package.json.
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  seguranca:
    name: Segurança (dependências, código, segredos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # o gitleaks varre o histórico inteiro
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.9.0 bandit==1.8.6
      # Vulnerabilidade conhecida em qualquer pacote do lock.
      # GHSA-xcq7-p3pf-p88h e GHSA-mf5v-w3w3-f6cg (opentelemetry-api
      # < 1.45.2): os dois estão no propagate.extract do trace context, que
      # nada aqui chama (a API local não tem instrumentação de entrada e só
      # escuta em 127.0.0.1). O google-adk 2.5.0 trava o pacote em <= 1.42.1;
      # tirar daqui quando ele aceitar a 1.45.2 (docs/SEGURANCA.md, N6).
      - run: pip-audit -r requirements.txt --ignore-vuln GHSA-xcq7-p3pf-p88h --ignore-vuln GHSA-mf5v-w3w3-f6cg
      # Padrões perigosos no código (shell, eval, XML sem proteção...).
      # Só severidade e confiança média para cima: o resto é ruído.
      - run: bandit -q -r agente_bpr orquestrador_bpr servidor_bpr seguranca_bpr -ll -ii
      # SBOM (CycloneDX): a lista de tudo o que entra, com versão, para a
      # segurança cruzar com vulnerabilidade nova sem pedir a ninguém.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: SBOM
        run: |
          python -m pip install cyclonedx-bom==7.6.0
          mkdir -p sbom
          cyclonedx-py requirements requirements.txt --of JSON -o sbom/python.cdx.json
          (cd frontend && npm sbom --sbom-format cyclonedx --package-lock-only --omit dev) > sbom/frontend.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90
      # Senha, token ou chave commitados em qualquer ponto do histórico.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner
